name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: e2e (GlitchTip ${{ matrix.glitchtip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with docs/compatibility.md.
        glitchtip: ["7.0.0"]
    env:
      GLITCHTIP_VERSION: ${{ matrix.glitchtip }}
      FAULTLINE_URL: http://localhost:8620
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: docker compose -f dev/compose.yml --profile app up -d --wait --build
      - run: bunx playwright install --with-deps chromium
      # Also seeds the demo organization and its issues.
      - run: bun run seed:performance http://localhost:8620
      - run: bun run e2e
      - if: failure()
        run: docker compose -f dev/compose.yml logs web faultline
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.glitchtip }}
          path: playwright-report

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
