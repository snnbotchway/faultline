# GlitchTip backend for local development and e2e tests.
# `--profile app` also runs the Faultline image in front of it, as in production.
# Pin the version we test against; see docs/compatibility.md.
name: faultline-dev
x-env: &env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  SECRET_KEY: dev-only-not-secret-0123456789abcdef
  PORT: "8000"
  GLITCHTIP_DOMAIN: ${FAULTLINE_URL:-http://localhost:5190}
  ENABLE_USER_REGISTRATION: "true"
  ENABLE_ORGANIZATION_CREATION: "true"
  EMAIL_URL: consolemail://
  # Span breakdowns, repeated queries, span groups and transaction trends are read from cold storage.
  GLITCHTIP_ENABLE_DUCKDB: "true"
  GLITCHTIP_COLD_STORAGE_DIR: /tmp/cold-storage
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 30
  valkey:
    image: valkey/valkey:8
  web:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-7.0.0}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_started }
    environment:
      <<: *env
      VALKEY_URL: redis://valkey:6379/0
    # Kept on a volume so the spans outlive the container. Mounted on /tmp, which the image makes
    # writable for its user; a new directory would belong to root. A plain `docker compose down` keeps
    # this volume while Postgres starts empty; `bun run backend:down` removes both for a clean reset.
    volumes: [cold-storage:/tmp]
    ports: ["127.0.0.1:${GLITCHTIP_PORT:-8600}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/settings/')"]
      interval: 3s
      retries: 60
  faultline:
    profiles: [app]
    build: ..
    image: faultline:dev
    depends_on:
      web: { condition: service_healthy }
    environment:
      BACKEND_URL: http://web:8000
    ports: ["127.0.0.1:${FAULTLINE_PORT:-8620}:8080"]
volumes:
  cold-storage:
