# GlitchTip backend for local development and e2e tests.
# Pin the version we test against; see docs/compatibility.md.
name: faultline-dev
x-env: &env
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
  SECRET_KEY: dev-only-not-secret-0123456789abcdef
  PORT: "8000"
  GLITCHTIP_DOMAIN: http://localhost:${FAULTLINE_PORT:-5190}
  ENABLE_USER_REGISTRATION: "true"
  ENABLE_ORGANIZATION_CREATION: "true"
  EMAIL_URL: consolemail://
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 30
  valkey:
    image: valkey/valkey:8
  web:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-7.0.0}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_started }
    environment:
      <<: *env
      VALKEY_URL: redis://valkey:6379/0
    ports: ["127.0.0.1:${GLITCHTIP_PORT:-8600}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/settings/')"]
      interval: 3s
      retries: 60
